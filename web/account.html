<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Account — Rocket in Cloud</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
</head>
<body class="account-page">
  <header class="topbar">
    <a class="brand" href="/"><picture><source srcset="/logo-dark.png?v=2" media="(prefers-color-scheme: dark)"><img class="logo" src="/logo.png?v=2" alt=""></picture>Rocket in Cloud</a>
    <a class="crumb" href="/account.html">Account</a>
    <span class="spacer"></span>
    <span class="me" id="me" hidden></span>
  </header>

  <main class="page acct" id="account" hidden>
    <div class="page-head">
      <h2>Account</h2>
      <span class="spacer"></span>
      <a class="btn" href="/" title="Your OpenRocket designs"><span data-icon="rocket"></span>Your designs</a>
    </div>
    <section class="acct-now" id="now" aria-live="polite"></section>
    <section id="delete-section" class="acct-card">
      <h3>Delete account</h3>
      <p>This permanently removes your account, your owned designs, memberships and custom motors.</p>
      <button class="danger" id="delete-account" type="button">Delete my account</button>
    </section>
  </main>

  <main class="page" id="loading">
    <p class="hint">Loading your account…</p>
  </main>

  <main class="page" id="signed-out" hidden>
    <h2>Account</h2>
    <p>Sign in on the <a href="/">home page</a> to view your account.</p>
  </main>

  <footer class="site-foot">
    <a href="https://cheerpj.com" target="_blank" rel="noopener">Built with CheerpJ</a>
    <span>·</span>
    <a href="/privacy.html">Privacy Policy</a>
    <span>·</span>
    <a href="/terms.html">Terms of Service</a>
    <span>·</span>
    <a href="https://github.com/retreat896/openrocket-CF" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script type="module" src="/src/account.js"></script>
</body>
</html>
