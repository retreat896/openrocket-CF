<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRocket Cloud - Sign in</title>
  <link rel="stylesheet" href="/src/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="brand-mark">OR</div>
      <h1>OpenRocket Cloud</h1>
      <div class="auth-tabs" role="tablist">
        <button id="login-tab" class="active" type="button" role="tab" aria-selected="true" aria-controls="login-form">Sign in</button>
        <button id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-form">Create account</button>
      </div>
      <form id="login-form" role="tabpanel" aria-labelledby="login-tab">
        <label>Email<input id="login-email" name="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="login-password" name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <form id="register-form" role="tabpanel" aria-labelledby="register-tab" hidden>
        <label>Name<input id="register-name" name="name" type="text" autocomplete="name" required></label>
        <label>Email<input id="register-email" name="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="register-password" name="password" type="password" autocomplete="new-password" minlength="10" required></label>
        <button class="primary" type="submit">Create account</button>
      </form>
      <p id="auth-error" class="error" hidden></p>
    </section>
  </main>
  <script type="module" src="/src/auth.js"></script>
</body>
</html>
