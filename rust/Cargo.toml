[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/worker",
    "crates/wasm",
]
default-members = [
    "crates/core",
    "crates/wasm",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
base64 = "0.22"
flate2 = "1"
hmac = "0.12"
quick-xml = "0.42"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["js", "serde", "v4"] }
zip = { version = "2.6", default-features = false, features = ["deflate"] }
