name = "openrocket-rust"
main = "crates/worker/build/index.js"
compatibility_date = "2026-11-18"

[build]
command = "cd crates/worker && cargo install -q worker-build && worker-build --release"

[assets]
directory = "./worker/public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*", "/room/*", "/or/*", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "openrocket-rust"
database_id = "aad6d22f-a6c9-4863-be4a-00da7a3edd0f"

[[r2_buckets]]
binding = "OPENROCKET_ASSETS"
bucket_name = "openrocket-rust-assets"

[durable_objects]
bindings = [
  { name = "DESIGN_ROOMS", class_name = "DesignRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DesignRoom"]

